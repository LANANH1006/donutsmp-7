name: Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip source (nếu có file zip)
        run: |
          for z in $(find . -maxdepth 2 -name "*.zip" -not -path "*/.git/*"); do
            echo "Giải nén $z"
            unzip -o "$z" -d _src
          done

      - name: Find project directory
        run: |
          f=$(find . -name settings.gradle -not -path '*/.git/*' | head -n 1)
          if [ -z "$f" ]; then
            echo "Không tìm thấy settings.gradle. Các file trong repo:"
            find . -not -path '*/.git/*' | head -50
            exit 1
          fi
          dir=$(dirname "$f")
          echo "Project dir: $dir"
          echo "PROJECT_DIR=$dir" >> "$GITHUB_ENV"

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: donutlike-mod
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
