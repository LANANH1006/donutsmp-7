name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tự tìm thư mục chứa settings.gradle (dù nằm ở gốc repo hay trong thư mục con)
      - name: Find project directory
        run: |
          f=$(find . -name settings.gradle -not -path '*/.git/*' | head -n 1)
          if [ -z "$f" ]; then echo "Không tìm thấy settings.gradle"; exit 1; fi
          echo "PROJECT_DIR=$(dirname "$f")" >> $GITHUB_ENV

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle build --no-daemon

      - name: Upload mod jar
        uses: actions/upload-artifact@v4
        with:
          name: donutlike-mod
          path: |
            ${{ env.PROJECT_DIR }}/build/libs/*.jar
            !${{ env.PROJECT_DIR }}/build/libs/*-sources.jar
